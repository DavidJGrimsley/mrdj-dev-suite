<svg xmlns="http://www.w3.org/2000/svg" width="20" height="115" viewBox="-10 -115 20 115" role="img" aria-labelledby="pen-title pen-description">
  <title id="pen-title">Vintage dip pen</title>
  <desc id="pen-description">A slim warm turned-wood holder with a brass collar and split gold nib on a transparent background. The nib tip is exactly at local coordinates zero, zero.</desc>
  <defs>
    <linearGradient id="pen-wood" gradientUnits="userSpaceOnUse" x1="-4" y1="0" x2="4" y2="0">
      <stop offset="0" stop-color="#4e3622" />
      <stop offset=".42" stop-color="#87613d" data-pen-barrel="true" />
      <stop offset=".7" stop-color="#c49a6c" />
      <stop offset="1" stop-color="#87613d" data-pen-barrel="true" />
    </linearGradient>
    <linearGradient id="pen-gold" gradientUnits="userSpaceOnUse" x1="-5" y1="-20" x2="5" y2="-10">
      <stop offset="0" stop-color="#8d6731" />
      <stop offset=".38" stop-color="#dcb364" data-pen-brass-stop="true" />
      <stop offset=".66" stop-color="#f7e2a8" />
      <stop offset="1" stop-color="#dcb364" data-pen-brass-stop="true" />
    </linearGradient>
  </defs>
  <path id="pen-holder" d="M-3.5-28-3-101Q-2-115 0-115Q2-115 3-101L3.5-28Z" fill="url(#pen-wood)" stroke="#c7a57a" stroke-opacity="0.38" stroke-width="0.45" />
  <rect id="pen-collar" x="-3.8" y="-31" width="7.6" height="5" fill="#dcb364" data-pen-brass-fill="true" />
  <path id="pen-nib" d="M0 0C-1.3-7-7-13-4.3-25H4.3C7-13 1.3-7 0 0Z" fill="url(#pen-gold)" stroke="#f7e2a8" stroke-opacity="0.25" stroke-width="0.3" />
  <path id="pen-slit" d="M0 0V-16" fill="none" stroke="#4a3820" stroke-width=".55" />
  <ellipse id="pen-breather" cx="0" cy="-17" rx=".9" ry="1.4" fill="#4a3820" />
</svg>
